<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NVX Session</title>
    <link rel="stylesheet" href="ui/tokens.css" />
    <link rel="stylesheet" href="chooser.css" />
  </head>
  <body>
    <div class="ambient" id="ambient" aria-hidden="true"></div>
    <main class="stage">
      <section class="ask" id="card" aria-labelledby="title">
        <header class="ask-head">
          <span class="ask-mark" id="mark"></span>
          <p class="eyebrow" id="eyebrow">Before it loads</p>
        </header>

        <h1 class="title" id="title">
          <span id="lead">Which session is</span>
          <span class="host" id="host">this site</span><span id="tail"> for?</span>
        </h1>
        <p class="sub" id="sub">Nothing has been sent to the site yet. Pick where it signs in.</p>

        <ol class="list" id="list" aria-label="Sessions">
          <li class="waiting">Reading your sessions</li>
        </ol>

        <div class="more">
          <form class="row row--new" id="new-form" autocomplete="off">
            <button class="row-hit" id="new-open" type="button" aria-expanded="false">
              <span class="glyph" aria-hidden="true">+</span>
              <span class="row-body">
                <span class="row-name">New session</span>
                <span class="row-meta">A fresh, empty jar for another account</span>
              </span>
              <kbd>N</kbd>
            </button>
            <div class="editor" id="new-editor" hidden>
              <input class="name-in" id="new-name" maxlength="40" aria-label="Session name" />
              <div class="swatches" id="new-swatches" role="radiogroup" aria-label="Colour"></div>
              <button class="go" type="submit">Create and open</button>
            </div>
          </form>

          <button class="row row--plain" id="once" type="button">
            <span class="row-hit">
              <span class="glyph" aria-hidden="true">&#8599;</span>
              <span class="row-body">
                <span class="row-name">No session</span>
                <span class="row-meta">Open it as a normal tab, outside NVX</span>
              </span>
              <kbd>Esc</kbd>
            </span>
          </button>
        </div>

        <label class="remember" id="remember-row">
          <input type="checkbox" id="remember" checked />
          <span class="switch" aria-hidden="true"></span>
          <span class="remember-text">Remember for <b id="remember-host">this site</b>, so new tabs open there without asking</span>
        </label>

        <footer class="foot">
          <span class="dest" id="dest"></span>
        </footer>
      </section>
    </main>
    <script src="ui/mark.js"></script>
    <script src="chooser.js"></script>
  </body>
</html>
